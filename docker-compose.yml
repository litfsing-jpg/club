version: '3.8'

services:
  app:
    image: discourse/base:2.0.20240101-0010
    container_name: iiclub-discourse
    restart: unless-stopped
    ports:
      - "${DISCOURSE_PORT:-3000}:80"
    environment:
      RAILS_ENV: production
      UNICORN_WORKERS: 2
      DISCOURSE_DB_HOST: postgres
      DISCOURSE_DB_NAME: discourse
      DISCOURSE_DB_USERNAME: discourse
      DISCOURSE_DB_PASSWORD: ${POSTGRES_PASSWORD:-discourse_secret}
      DISCOURSE_REDIS_HOST: redis
      DISCOURSE_DEVELOPER_EMAILS: ${ADMIN_EMAIL:-admin@example.com}
      DISCOURSE_HOSTNAME: ${HOSTNAME:-localhost}
      DISCOURSE_SMTP_ADDRESS: ${SMTP_ADDRESS:-smtp.example.com}
      DISCOURSE_SMTP_PORT: ${SMTP_PORT:-587}
      DISCOURSE_SMTP_USER_NAME: ${SMTP_USER:-user}
      DISCOURSE_SMTP_PASSWORD: ${SMTP_PASSWORD:-password}
    volumes:
      - ./plugins/discourse-club-access:/var/www/discourse/plugins/discourse-club-access:ro
      - ./themes/iiclub-theme:/var/www/discourse/themes/iiclub-theme:ro
      - discourse_shared:/shared
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: iiclub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: discourse
      POSTGRES_USER: discourse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discourse_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: iiclub-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  discourse_shared:
