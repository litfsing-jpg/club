## Конфигурация Discourse Launcher для продакшн развёртывания
## Исходный образ: discourse/base

templates:
  - "templates/postgres.template.yml"
  - "templates/redis.template.yml"
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"

expose:
  - "80:80"
  - "443:443"

params:
  db_default_text_search_config: "pg_catalog.russian"

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  LANGUAGE: en_US.UTF-8
  DISCOURSE_DEFAULT_LOCALE: ru
  DISCOURSE_HOSTNAME: club.example.com
  DISCOURSE_DEVELOPER_EMAILS: 'admin@example.com'

hooks:
  after_code:
    - exec:
        cd: $home/plugins
        cmd:
          # Официальные плагины Discourse
          - git clone https://github.com/discourse/discourse-chat.git
          - git clone https://github.com/discourse/discourse-reactions.git
          - git clone https://github.com/discourse/discourse-topic-voting.git
          - git clone https://github.com/discourse/discourse-solved.git
          - git clone https://github.com/discourse/discourse-presence.git
          - git clone https://github.com/discourse/discourse-templates.git
          - git clone https://github.com/discourse/discourse-checklist.git
          # Кастомный плагин доступа в клуб
          - cp -r /var/www/discourse/local_plugins/discourse-club-access $home/plugins/
